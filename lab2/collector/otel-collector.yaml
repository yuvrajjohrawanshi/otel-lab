# ─────────────────────────────────────────────────────────────────────────────
# OTel Collector Gateway — runs on a dedicated Collector VM (same VM for lab)
# Receives LOGS from the OTel Agent, then forwards to Dynatrace via ActiveGate.
# Metrics and Traces are intentionally ignored (handled by OneAgent).
# ─────────────────────────────────────────────────────────────────────────────

receivers:

  # ── Accept logs from local OTel Agent ──────────────────────────────────────
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:

  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128

  batch:
    timeout: 5s
    send_batch_size: 2000

exporters:

  # ── Send logs to Dynatrace via ActiveGate OTLP endpoint ──────────────────
  otlphttp:
    endpoint: "${env:DT_ACTIVEGATE_ENDPOINT}"
    headers:
      Authorization: "Api-Token ${env:DT_API_TOKEN}"
    tls:
      insecure_skip_verify: true    # remove in production

  debug:
    verbosity: basic

service:
  pipelines:

    logs:
      receivers:  [otlp]
      processors: [memory_limiter, batch]
      exporters:  [otlphttp, debug]

  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8889        # Collector's own self-monitoring metrics
