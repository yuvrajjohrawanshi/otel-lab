# ─────────────────────────────────────────────────────────────────────────────
# OTel Agent (Logs-Only Mode) — runs on EVERY monitored VM
# Objective: Read OS-level and application logs and forward them to Collector.
# Note: Metrics and Traces are intentionally omitted because Dynatrace OneAgent
#       is running in full-stack mode to handle those signals.
# ─────────────────────────────────────────────────────────────────────────────

receivers:

  # ── System Logs (journald → OTLP Logs) ───────────────────────────────────
  journald:
    directory: /run/log/journal     # default journald socket directory
    units:
      - otel-app                    # our vanilla standalone Node app
    priority: info

  filelog:
    include:
      - /var/log/messages           # RHEL general syslog
      - /var/log/secure             # Auth / SSH events
    start_at: end
    include_file_path: true
    include_file_name: false
    operators:
      - type: regex_parser
        regex: '^(?P<time>[A-Z][a-z]{2}\s+\d+\s[\d:]+)\s(?P<host>\S+)\s(?P<ident>[^\[:\s]+)(?:\[(?P<pid>\d+)\])?\s*:\s*(?P<message>.*)$'
        timestamp:
          parse_from: attributes.time
          layout: "%b %d %H:%M:%S"

processors:

  # ── Enrich every log with VM hostname, OS, and IP ────────────────────────
  resourcedetection:
    detectors: [system, env]
    system:
      hostname_sources: [os]
      resource_attributes:
        host.name:
          enabled: true
        host.id:
          enabled: true
        os.type:
          enabled: true
    timeout: 5s
    override: false

  memory_limiter:
    check_interval: 5s
    limit_mib: 256                  # Agent is lightweight — cap at 256MB
    spike_limit_mib: 64

  batch:
    timeout: 5s
    send_batch_size: 1000

exporters:

  # ── Forward logs to the central Collector Gateway ────────────────────────
  otlp:
    endpoint: "${env:COLLECTOR_ENDPOINT}"   # e.g. grpc://127.0.0.1:4317
    tls:
      insecure: true

  debug:
    verbosity: basic

service:
  pipelines:

    logs:
      receivers:  [journald, filelog]
      processors: [resourcedetection, memory_limiter, batch]
      exporters:  [otlp, debug]

  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888        # Agent's own self-monitoring metrics
