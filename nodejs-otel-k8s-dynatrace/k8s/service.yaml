apiVersion: v1
kind: Service
metadata:
  name: my-otel-app
  namespace: my-app
spec:
  selector:
    app: my-otel-app   # matches the label on the pod
  ports:
    - name: http
      port: 80         # port OTHER things use to reach the service
      targetPort: 3000 # port the container actually listens on
  type: ClusterIP      # only reachable inside the cluster
