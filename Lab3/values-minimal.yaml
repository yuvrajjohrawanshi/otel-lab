# Minimal values for KillerCoda (4GB node)
# Disables heavy/non-essential services to fit within resource constraints
# Component names match the official chart: https://github.com/open-telemetry/opentelemetry-helm-charts

components:
  # --- Keep: Core shopping flow ---
  frontend:
    enabled: true
  frontendProxy:
    enabled: true
  cart:
    enabled: true
  checkout:
    enabled: true
  currency:
    enabled: true
  shipping:
    enabled: true
  payment:
    enabled: true
  email:
    enabled: true
  productCatalog:
    enabled: true

  # --- Disable: Non-essential services ---
  ad:
    enabled: false
  recommendation:
    enabled: false
  quote:
    enabled: false
  loadGenerator:
    enabled: false
  fraudDetection:
    enabled: false
  accounting:
    enabled: false
  kafka:
    enabled: false
  imageProvider:
    enabled: false
  flagd:
    enabled: false

# Disable heavy observability sub-charts
prometheus:
  enabled: false
grafana:
  enabled: false
opensearch:
  enabled: false
